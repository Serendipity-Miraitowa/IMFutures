spring.application.name=IMFutures

spring.datasource.url=jdbc:mysql://localhost:3306/imfuture?useUnicode=utf-8&useEncoding=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080


mybatis.type-aliases-package=org.example.imfutures.pojo
mybatis.mapper-locations=classpath:mapper/*.xml

logging.level.mapper=DEBUG
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler